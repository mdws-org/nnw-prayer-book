                            <p>The US Supreme Court heard arguments from oil companies on Monday that could help decide the fate of more than two dozen lawsuits accusing the industry of deceiving the public about climate change. The claims seek potentially billions of dollars in damages to help pay the costs imposed by climate-related extreme weather.</p>
<p>Yet the questions before the court did not focus on the merits of these claims but instead on technical legal matters over whether they should proceed at all.</p>
<p>The case being argued was brought in 2018 by the city and county of Boulder against ExxonMobil and Suncor Energy in Colorado state court. While the case and dozens like it have survived multiple appeals in state and federal courts, the oil companies are asking the Supreme Court to declare that federal law preempts state and local governments from bringing such claims.</p><p><a href="https://arstechnica.com/tech-policy/2026/10/big-oil-asks-supreme-court-to-kill-climate-lawsuits-before-trial/">Read full article</a></p>
