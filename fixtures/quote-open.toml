body = '''<p><strong>"I’ve always felt like A Golden Wake never lived up to its full potential".</strong></p><p>It wasn't all that long ago that Grundislav Games transported players back to the Old West with their 2025 Steam release, <a class="external" href="https://store.steampowered.com/app/1226670/Rosewater/"><strong>Rosewater</strong></a>, but the developer Francisco González already seems to have decided on his next project: <a class="external" href="https://store.steampowered.com/app/3955330/A_Golden_Wake_Roaring_20s_Edition/">a reimagining of his first commercial game, the 2014 point-and-click adventure <strong>A Golden</strong></a> <strong><a class="external" href="https://store.steampowered.com/app/3955330/A_Golden_Wake_Roaring_20s_Edition/">Wake</a></strong> (thanks, <a class="external" href="https://adventuregamehotspot.com/announcement/7727/a-golden-wake-to-shine-brighter-in-roaring-20s-edition">Adventure Game Hotspot</a>!).</p><p>That's right, after more than a decade away, Grundislav Games is taking us back to the roaring '20s, to revisit the story of salesman Alfie Banks, as he relocates to the tropical paradise of Sunny Miami, Florida, in order to make a fortune.</p><p>Read the <a href="https://www.timeextension.com/news/2026/11/time-to-revisit-the-roaring-20s-12-years-later-the-point-n-click-adventure-a-golden-wake-is-getting-a-reimagining">full article on timeextension.com</a></p>'''
