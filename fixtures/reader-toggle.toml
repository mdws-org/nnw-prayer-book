<p>For a long time I have been a fan of minimalism in my physical life:
have few physical possessions, and try to do more with less. Four years
ago, I wrote <a
href="https://vitalik.eth.limo/general/2022/06/20/backpack.html">this
blog post</a> describing what I had in the 40-liter backpack that I
travel around with.</p>
<p>Physical minimalism, however, was an idea that came of age in the
2000s and 2010s and was responding to the challenges and the
opportunities of the 2000s and 2010s. I continue to believe that it is
valuable - though I recognize some arguments in the other direction,
notably that having <em>the right kinds</em> of physical things can make
more practical to have more self-sovereignty over your life. But I also
think that in the modern era, we need a new kind of minimalism:
<strong>digital minimalism</strong>.</p>'''
