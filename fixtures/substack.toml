body = '''<img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/lKUB_Ynw.png" alt="OpenAI connects the Dots"><p><em>This is a column about AI. My fianc&#xe9; works at Anthropic. See&#xa0;my full ethics disclosure </em><a href="https://platformer.news/ethics?ref=platformer.news" rel="noreferrer"><em>here</em></a><em>.</em></p><p>In November 2023, a year after the release of ChatGPT, Bill Gates wrote that &quot;<a href="https://www.gatesnotes.com/AI-agents?ref=platformer.news" rel="noreferrer">AI is about to completely change how you use computers</a>.&quot; Writing on his blog, Gates predicted that the age of apps was coming to an end. </p><p>&quot;You won&#x2019;t have to use different apps for different tasks,&quot; Gates wrote. &quot;You&#x2019;ll simply tell your device, in everyday language, what you want to do. And depending on how much information you choose to share with it, the software will be able to respond personally because it will have a rich understanding of your life. In the near future, anyone who&#x2019;s online will be able to have a personal assistant powered by artificial intelligence that&#x2019;s far beyond today&#x2019;s technology.&quot;</p><p>Does 2026 still count as the &quot;near future&quot;? Since around the time of Gates&apos; blog post on the subject, tech leaders have predicted that we would soon see the rise of agents like the ones proposed by the Microsoft co-founder. But various limitations of chatbots &#x2014; short memories, an inability to learn, and a lack of basic capabilities &#x2014; delayed their arrival. </p><p>Recently, though, the agents have started to catch up to the hype. (Emphasis there on <em>started</em>.) Earlier this summer I began <a href="https://www.platformer.news/town-interview-jean-denis-greze-assistants/" rel="noreferrer">experimenting with Town</a>, which lets me delegate various work tasks by messaging an AI avatar. More recently Silicon Valley has become captivated by <a href="https://instinct.com/?ref=platformer.news" rel="noreferrer">Instinct</a>, a messaging-based agent aimed more at personal use.</p><p>Last week at his company&apos;s developer conference, Meta CEO Mark Zuckerberg <a href="https://www.platformer.news/meta-connect-2026-muse-vr-glasses/" rel="noreferrer">heavily promoted Muse</a>, its own consumer-focused agent, which he positioned as a new peer to company pillars like Instagram and WhatsApp.</p><p>But after admittedly limited testing &#x2014; I only got access a couple hours ago &#x2014; so far I have been most impressed with Dots, the new agent from OpenAI. It&apos;s highly capable, focused on the work I actually do, and intuitive to use.</p><p>Unlike Meta&apos;s Muse, it isn&apos;t free: to start, Dots will be available only to paid users of ChatGPT. (&quot;You should of course expect us to do a mass-market [product] for billions of people someday,&quot; OpenAI CEO Sam Altman told reporters Tuesday during a Q&amp;A I attended.)</p><p>As someone who plans to use Dots for work, though, paying for the product builds my trust in it. Zuckerberg says Meta plans to fund Muse by taking a cut of transactions, which means that it will soon be some team&apos;s job to massively increase the number of transactions that take place within Muse. (I imagine ads will play a starring role here.) Not everyone can afford to pay what Dots will cost, and on balance I&apos;m happy to see free alternatives in the marketplace. But I&apos;d rather pay someone &#x24;100 a month than hack through a thicket of suggested purchases every time I want an agent to check the status of a work project, so I think OpenAI could have a nice lane to itself here.</p><p>Here&apos;s a good place to note that using an agent like this requires that you place a massive amount of trust in a platform. Giving an agent access to your text messages, emails, and banking information can go badly in all kinds of ways, and it&apos;s completely reasonable to decide you would rather be a late adopter here, if you choose to adopt agents at all. Meta already operates at a significant trust deficit with its user base, and OpenAI is in the midst of a seemingly never-ending series of disclosures about various ways its agents misbehaved during testing. (The company announced yesterday that it had <a href="https://www.wsj.com/tech/ai/openai-chatgpt-model-release-cancel-safety-5a2f9f42?ref=platformer.news" rel="noreferrer">scrapped GPT-6.1 Astra</a> because, among other things, it regularly deceived users about what it had and had not done.)</p><p>OpenAI executives including Altman went to some lengths on Tuesday to reassure users that Dots would use GPT-6 Astra, which the company says is much better aligned than its aborted successor. In any case, I am in the trying-software business, and if nothing else Dots seemed like uncommonly newsworthy software to try.</p><p>Like Muse, Dots leans a bit harder into a cutesy, juvenile aesthetic than I might choose myself for a product that wants access to your bank account and credit card. While your Dot can be represented as simply as a colored ring named &quot;Dot,&quot; you&apos;re encouraged to consider some of the jollier alternatives &#x2014; a hexagon wearing a beret, a heart in sunglasses, and so on. For my Dot, I picked a pillowy blue cloud shape, threw some googly eyes and a bowtie on it, and named it Kicker, after journalist slang for the final sentence of a story.</p><p>From there, I decided to attempt to &quot;cowork&quot; with my Dot: giving it a task and letting it work in the background while I worked on this column. It turns out this is a rhythm many of us are already in: sending a message to a coworker, doing a bit of work, then following up with another message. I like that Dots are represented as a running chat inside ChatGPT &#x2014; the conversation feels more natural than the experience on Town, where every request spins up its own chat &#x2014; and with Dots you can always see at a glance exactly where you left off.</p><p>Over the next couple hours, I got a pleasing amount of work done. As it so happens, I have recently become an ideal customer for an agent like Kicker: I just co-founded a new podcast company with my friend Kevin Roose, and every week brings some totally unfamiliar process into my life: drafting a founder agreement, a budget, a grant proposal, a profit-sharing plan, and so on. Of course, I want to make sure that the final versions of all these represent my own writing and thinking. But I have been happy to let AI tools write the first drafts, and so far I feel like this has saved me many hours of fairly difficult work.</p><p>Kicker performed admirably today at the tasks I gave it: turning down a request to go on a radio show where I had a conflict; drafting an email to our lawyer with the new company vacation policy; and answering some questions from my bookkeeper. </p><p>More ambitiously, it helped to fill out an arcane document sent to me by our insurance broker, who wanted to know a bunch of information about our new office building (number of floors, whether it had fire sprinklers) that I didn&apos;t know offhand. Kicker found the lease, did some research on city websites, checked our budget documents, and asked enough follow-up questions that it was able to answer all but two of the broker&apos;s questions while I worked.</p><p>After that, I asked Kicker what else it thought we should do. It used the transcript of a team meeting to draft an agenda for our follow-up meeting tomorrow, and created a prep doc for a panel I&apos;m moderating this weekend. It also emailed my speaking agent (with my permission) to clarify a potential scheduling conflict in November.</p><p>I&apos;m cognizant that any person&apos;s account of how they used an AI tool can sound suspiciously close to bragging. Look how impossibly busy I am! Look how desperately I need the aid of an AI tool to have even a remote chance of taming my inbox! It is perfectly reasonable to read a list of tasks like this and think: who cares.</p><p>But as someone in the trying-software business, I try to recognize the difference between tools that simply make me feel more productive and those that actually save me time. And given all the searching and typing Kicker did on my behalf this afternoon, I estimate that it did about two hours of work for me with only about 15 minutes of effort on my part. By that I mean it would have taken <em>me</em> two hours to do all that, and now I don&apos;t have to, and it feels great.</p><p>Given the access that I&apos;ve given Kicker, few will have sympathy for me should it overreach &#x2014; by hacking into Hugging Face, or the government of Australia, or wherever else OpenAI&apos;s next batch of agents decides to set up a message board. It is almost certainly more prudent to start small here, if you start at all: connecting your Slack workspace, if you&apos;re a small team; or your Granola account; or something else that feels a bit less mission-critical.</p><p>In the meantime, though, the vision Gates laid out three years ago now exists &#x2014; more or less &#x2014; inside ChatGPT. The risks to privacy, security, and safety are real. But the benefits are, too &#x2014; and I suspect the company that can manage the downsides most effectively will have a big business on its hands.  </p><hr><p><strong>What people are saying:</strong> While I liked the Dots launch, analyst Benedict Evans <a href="https://www.threads.com/@benedictevans/post/Dd4j-8Hm8-g?ref=platformer.news" rel="noreferrer">raised some fair points</a> about the &quot;rather confused&quot; messages OpenAI offered in the product launch video: &quot;Consumer branding and product design, childish anthropomorphism, hardcore startup software-engineer use-cases randomly mixed with wedding planning.&quot; How to position agents on the consumer-to-enterprise product spectrum feels like it&apos;s a puzzle no one has yet solved.</p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="600" height="157" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png 600w"></figure><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/MG_CoverPhoto_Centered_WhiteOnOlive.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="1500" height="500" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w600/2026/09/MG_CoverPhoto_Centered_WhiteOnOlive.png 600w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w1000/2026/09/MG_CoverPhoto_Centered_WhiteOnOlive.png 1000w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/MG_CoverPhoto_Centered_WhiteOnOlive.png 1500w" sizes="(min-width: 720px) 720px"></figure><p><strong>On the Instagram Live this week: </strong>Would you believe there are only 19 days until launch week? We still have a lot to do, but in the meantime Kevin and I will be going live on Instagram on Friday at noon PT to discuss the following topics:</p><ul><li>OpenAI Dev Day</li><li>Building a podcast set in 2026</li><li>Listener questions</li></ul><p>If any of that sounds fun, <a href="https://www.instagram.com/crumbler?ref=platformer.news" rel="noreferrer">follow me</a> and <a href="https://www.instagram.com/kevinroose?ref=platformer.news" rel="noreferrer">Kevin</a> on Instagram and the Meta Corporation will helpfully notify when we are live. Or just have your Muse watch and fill you in later!</p><p>Also it&apos;s a great time to add the show in your podcast player of choice:</p><p><a href="https://www.youtube.com/@machinegodspod?ref=platformer.news" rel="noreferrer"><strong>YouTube</strong></a><strong> | </strong><a href="https://podcasts.apple.com/us/podcast/machine-gods/id6812430636?ref=platformer.news" rel="noreferrer"><strong>Apple</strong></a><strong> | </strong><a href="https://open.spotify.com/show/5kxu4uluMq6jUuoNPGyZMu?si=c3ec25c874154f04&amp;ref=platformer.news" rel="noreferrer"><strong>Spotify</strong></a><strong> | </strong><a href="https://feeds.npr.org/g-s1-143588/podcast.xml?ref=platformer.news" rel="noreferrer"><strong>RSS</strong></a></p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="600" height="157" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png 600w"></figure><h2 id="following">Following</h2><p></p><h3 id="pope-leo-rebukes-jensen-huang-on-ai-safety">Pope Leo rebukes Jensen Huang on AI safety</h3><p><strong>What happened:</strong> At a press conference, Pope Leo XIV <a href="https://www.ft.com/content/5c627794-766b-49db-ab96-7532731e7084?syn-25a6b1a6=1&amp;ref=platformer.news"><u>urged</u></a> people to take AI safety concerns seriously &#x2014;&#xa0;and criticized Nvidia CEO Jensen Huang for downplaying risks from AI.</p><p>The pontiff mentioned an <a href="https://developer.nvidia.com/blog/nvidia-open-agent-safety-platform-a-reference-for-continuous-in-silicon-agent-monitoring?ref=platformer.news"><u>agent security platform</u></a> Nvidia had recently released, saying, &#x201c;It&#x2019;s interesting to note that, just today, I read that the head of Nvidia claims that he has found some way of inserting into AI certain guardrails.&#x201d;</p><p>Pope Leo said, &#x201c;He&#x2019;s the same one, however, that says there should be no limits placed and no government regulation.&#x201d;</p><p>&#x201c;I do think that &#x200b;the concerns raised by many of the experts, specialists in AI, should be &#x200b;taken seriously,&quot; the Pope <a href="https://www.reuters.com/world/europe/pope-leo-says-concerns-about-ai-doom-are-not-fake-news-2026-09-28/?ref=platformer.news"><u>told reporters</u></a>. &quot;I don&apos;t think that that is &#x200b;fake news, as some have said.&#x201d;</p><p><strong>Why we&#x2019;re following:</strong> Aside from the tantalizing prospect raised here that the Pope is listening to <a href="https://www.nytimes.com/2026/09/23/opinion/ezra-klein-podcast-jensen-huang.html?ref=platformer.news" rel="noreferrer">the Ezra Klein Show</a>, or possibly even reading Techmeme?</p><p>Well: Pope Leo clearly disagrees with President Donald Trump, <a href="https://www.nbcnews.com/politics/trump-administration/trump-rejects-ai-guardrails-rcna597700?ref=platformer.news"><u>who called</u></a> concerns AI could cause human extinction a &#x201c;hoax&#x201d; earlier this month.</p><p>The Pope has had a notably AGI-pilled reign so far: in his first <a href="https://www.politico.eu/article/pope-leo-xiv-ai-meetings-silicon-valley-vatican/?ref=platformer.news"><u>address</u></a> to the college of cardinals, he said the Church would be offering teachings &#x201c;in response to another industrial revolution and the developments of artificial intelligence.&#x201d; In May, he delivered <a href="https://www.nytimes.com/2026/05/25/world/europe/pope-leo-encyclical.html?unlocked_article_code=1.lFA.ZO8g.ywQ-ffnOl1j9&amp;smid=nytcore-ios-share&amp;ref=platformer.news"><u>a papal encyclical</u></a> about artificial intelligence. His 42,000-plus-word message highlighted AI&#x2019;s threat to workers, and called for keeping AI out of lethal war-time decisions.</p><p>At the press conference, Pope Leo encouraged people &#x201c;to promote dialogue, study, investigation, to find ways to make sure that AI does not get to &#x200b;a point where it could destroy humanity&#x201d; &#x2014; emphasizing extinction-level threats more than in his earlier statements.&#xa0;</p><p>&#x201c;We can&apos;t just &#x200b;sit back and pretend nothing&apos;s going to happen,&#x201d; the pope said.</p><p><strong>What people are saying:</strong> On <strong>X</strong>, <strong>Epic Games</strong> CEO <strong>Tim Sweeney</strong> <a href="https://x.com/TimSweeneyEpic/status/2105064353535779326?s=20&amp;ref=platformer.news"><u>wrote</u></a>, &#x201c;Unusual for the Pope to attack the Cardinal of Santa Clara.&#x201d;</p><p>On <strong>r/technology</strong>, poster <strong>Emotional_Solid6538</strong> <a href="https://www.reddit.com/r/technology/comments/1wt0ig8/comment/pcqhrye/?utm_source=share&amp;utm_medium=web3x&amp;utm_name=web3xcss&amp;utm_term=1&amp;utm_content=share_button"><u>wrote</u></a>, &#x201c;First time I&apos;m on the side of Catholic Church.&#x201d;</p><p>&#x2014;<em>Ella Markianos</em></p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="600" height="157" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png 600w"></figure><h3 id="those-good-posts">Those good posts</h3><p><em>For more good posts every day, </em><a href="https://www.instagram.com/crumbler/?ref=platformer.news"><em>follow Casey&#x2019;s Instagram stories</em></a><em>.</em></p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/Screenshot-2026-09-29-at-4.46.07---PM.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="1228" height="470" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w600/2026/09/Screenshot-2026-09-29-at-4.46.07---PM.png 600w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w1000/2026/09/Screenshot-2026-09-29-at-4.46.07---PM.png 1000w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/Screenshot-2026-09-29-at-4.46.07---PM.png 1228w" sizes="(min-width: 720px) 720px"></figure><p>(<a href="https://www.platformer.news/open-ai-model-release-canceled/" rel="noreferrer">Link</a>)</p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/Screenshot-2026-09-29-at-4.46.28---PM.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="1216" height="674" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w600/2026/09/Screenshot-2026-09-29-at-4.46.28---PM.png 600w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w1000/2026/09/Screenshot-2026-09-29-at-4.46.28---PM.png 1000w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/Screenshot-2026-09-29-at-4.46.28---PM.png 1216w" sizes="(min-width: 720px) 720px"></figure><p>(<a href="https://www.threads.com/@mclarebuildsaas/post/Dd3XmnSimqC?ref=platformer.news" rel="noreferrer">Link</a>)</p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/Screenshot-2026-09-29-at-4.47.05---PM.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="888" height="696" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/size/w600/2026/09/Screenshot-2026-09-29-at-4.47.05---PM.png 600w, https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2026/09/Screenshot-2026-09-29-at-4.47.05---PM.png 888w" sizes="(min-width: 720px) 720px"></figure><p>(<a href="https://www.threads.com/share/E1qEJMD8D/?ref=platformer.news" rel="noreferrer">Link</a>)</p><figure class="kg-card kg-image-card"><img src="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png" class="kg-image" alt="OpenAI connects the Dots" loading="lazy" width="600" height="157" srcset="https://storage.ghost.io/c/a0/4c/a04c7225-d919-4d78-9b7c-a3fdd071349b/content/images/2024/05/floating_linebreak_600px-1.png 600w"></figure><h3 id="talk-to-us">Talk to us</h3><p>Send us tips, comments, questions, and dot use cases: <a href="mailto:casey@platformer.news">casey@platformer.news</a>. Read <a href="https://www.platformer.news/ethics/">our ethics policy here</a>.</p><div class="kg-card kg-button-card kg-align-center"><a href="https://www.notion.so/platformer/Advertising-Policy-471e6f2b0ec84d14b1b87e8b0863f4cf?ref=platformer.news" class="kg-btn kg-btn-accent">Sponsor a Newsletter</a></div><hr>'''
